<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="athomon.com">
<style>
  .orb { fill: none; stroke: #0D0F12; stroke-width: 1; opacity: .32; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .e { fill: #0D0F12; opacity: 0; animation: fade .8s ease forwards; }
  @keyframes fade { to { opacity: 1; } }
  .nuc { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop 1s cubic-bezier(.34,1.56,.64,1) .2s forwards; }
  @keyframes pop { to { transform: scale(1); } }
  .label { opacity: 0; animation: fade .8s ease 1.1s forwards; }
  .pulse { fill: none; stroke: #0D0F12; stroke-width: 1; transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse 3.2s cubic-bezier(.16,1,.3,1) 2.4s infinite; }
  @keyframes pulse { 0% { opacity: .45; transform: scale(1); } 100% { opacity: 0; transform: scale(1.45); } }
  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; stroke-dashoffset: 0; } .e, .pulse { display: none; }
    .nuc, .label { animation: none; transform: none; opacity: 1; }
  }
</style>
