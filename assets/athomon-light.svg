<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="ATHOMON">
<style>
  .move { transform-origin: 355.5px 160.0px; transform: translate(284.5px, 0) scale(1.9); animation: move 1s cubic-bezier(.65,0,.35,1) 1.75s forwards; }
  @keyframes move { to { transform: none; } }
  .core { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .9s cubic-bezier(.34,1.56,.64,1) .2s forwards; }
  @keyframes pop { to { transform: scale(1); } }
  .spin { transform-origin: 60px 60px; transform: rotate(-35deg); animation: tilt 1.5s cubic-bezier(.16,1,.3,1) .45s forwards; }
  @keyframes tilt { to { transform: rotate(0deg); } }
  .ring { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.65,0,.35,1) .45s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .l { opacity: 0; transform: translateX(-140px); animation: in .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .dot { opacity: 0; animation: fade .6s ease 3.3s forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .move, .core, .spin, .l { animation: none; transform: none; opacity: 1; }
    .ring { animation: none; stroke-dashoffset: 0; } .dot { display: none; }
  }
</style>
